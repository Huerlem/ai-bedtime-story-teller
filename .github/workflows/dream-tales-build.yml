name: Dream Tales V2 — compile validation
on:
  push:
    branches: [feature/dream-tales-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: 'test-non-secret'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'example.invalid'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'dream-tales-ci'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'dream-tales-ci.appspot.com'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:1234567890:web:0000000000000000000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no lockfile in historical repository)
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Compile Next.js production bundle
        run: npm run build
