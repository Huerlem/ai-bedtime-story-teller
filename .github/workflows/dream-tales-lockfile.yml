name: Dream Tales V2 — generate lockfile (temporary)
on:
  push:
    branches: [feature/dream-tales-v2]
    paths: [package.json, .github/workflows/dream-tales-lockfile.yml]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency tree into package-lock.json (no install scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile installs reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund && npm ls next react react-dom firebase firebase-admin
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --json > audit.json || true
      - name: Emit lockfile and audit for review (artifact storage is not reachable from the dev sandbox)
        run: |
          echo "LOCK_SHA256=$(sha256sum package-lock.json | cut -d' ' -f1)"
          echo "::group::lockfile-b64"; echo "BEGIN_LOCK"; tar czf - package-lock.json audit.json | base64 -w 0; echo; echo "END_LOCK"; echo "::endgroup::"
